title: Software Development Thoughts
description: Thoughts on Software Development
author:
  name: Robert Elliot
  email: rob@lidalia.org.uk
baseurl: ""
url: https://blog.lidalia.org.uk

# Build settings
markdown: kramdown

# Minima 3 is not released as a gem, so it is consumed from its repository.
# Pinned to a specific commit - upstream master is a moving target.
remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

minima:
  skin: auto
  social_links:
    - title: Rob Elliot at GitHub
      icon: github
      url: "https://github.com/Mahoney"
    - title: Rob Elliot at X (formerly Twitter)
      icon: x-twitter
      url: "https://x.com/RobElliot266"

# Minima 3 still uses the deprecated @import syntax.
sass:
  quiet_deps: true
  silence_deprecations: [import]

permalink: /:categories/:year/:month/:title.html

# Setting `exclude` replaces Jekyll's defaults rather than adding to them,
# so the gem paths have to be repeated here or a stale vendor/ directory
# gets processed as site content.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
  - build.sh
  - new_post.sh
  - Dockerfile
  - .dockerignore
  - README.md
