# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.author.email }}, and
# so on. You can create any custom variable you would like, and they will be
# accessible in the templates via {{ site.myvariable }}.
title: Software Development Thoughts
description: Thoughts on Software Development
author:
  name: Robert Elliot
  email: rob@lidalia.org.uk
baseurl: ""
url: https://blog.lidalia.org.uk

# Build settings
markdown: kramdown

# Minima 3 is not released as a gem, so it is consumed from its repository.
# Pinned to a specific commit - upstream master is a moving target.
remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag

minima:
  skin: auto
  social_links:
    - title: Rob Elliot at GitHub
      icon: github
      url: "https://github.com/Mahoney"
    - title: Rob Elliot at X (formerly Twitter)
      icon: x-twitter
      url: "https://x.com/RobElliot266"

# Minima 3 still uses the deprecated @import syntax.
sass:
  quiet_deps: true
  silence_deprecations: [import]

permalink: /:categories/:year/:month/:title.html

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
